<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蛋殼喵 DaiEn — 作家・程序員・企業負責人</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a7cf52'/%3E%3Cpath d='M32 15c8 0 14 7 14 16 0 10-6 18-14 18S18 41 18 31c0-9 6-16 14-16z' fill='%23f7fbef'/%3E%3Ccircle cx='26' cy='32' r='2.6' fill='%232f3e25'/%3E%3Ccircle cx='38' cy='32' r='2.6' fill='%232f3e25'/%3E%3Cpath d='M32 37l-3 4h6z' fill='%237fac30'/%3E%3C/svg%3E">
<style>
	/* ===== 自製圖標字型：簽名用 cat-153，字碼 \F0098（對應 webfonts/font.css） ===== */
	@font-face {
		font-family: 'CatEmoji';
		font-style: normal;
		font-display: swap;
		src: url('/webfonts/EggshellCat.woff') format('woff'),
			url('/webfonts/EggshellCat.ttf') format('truetype');
	}
	.cat {
		font-family: 'CatEmoji';
		font-style: normal;
		font-weight: 300;
		line-height: 1;
		display: inline-block;
		-webkit-font-smoothing: antialiased;
	}
	.cat-005:before { content: "\F0004"; }
	.cat-013:before { content: "\F000C"; }
	.cat-014:before { content: "\F000D"; }
	.cat-015:before { content: "\F000E"; }
	.cat-078:before { content: "\F004D"; }
	.cat-079:before { content: "\F004E"; }
	.cat-097:before { content: "\F0060"; }
	.cat-111:before { content: "\F006E"; }
	.cat-112:before { content: "\F006F"; }
	.cat-153:before { content: "\F0098"; }
	.cat-257:before { content: "\F0100"; }
	.cat-258:before { content: "\F0101"; }
	.cat-1x { font-size: 1em; }
	.cat-2x { font-size: 2em; }
	.cat-3x { font-size: 3em; }
	/* ===== 色票：蘋果綠為底，配橄欖墨字與暖奶油，只在重點處加深 ===== */
	:root {
		--paper: #eef7dd;        /* 蘋果綠底 */
		--paper-deep: #e3f1c9;   /* 區塊之間的淺帶 */
		--cream: #fffdf3;        /* 暖奶油，只給需要呼吸的地方 */
		--ink: #2f3e25;          /* 主字：深橄欖 */
		--ink-soft: #5f6f4d;     /* 副字 */
		--leaf: #7fac30;         /* 蘋果綠本體 */
		--leaf-deep: #587d22;    /* 連結與簽名 */
		--line: #cfe3ae;
		--serif: "Songti TC", "Noto Serif TC", "PMingLiU", Georgia, serif;
		--sans: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, "Segoe UI", sans-serif;
	}

	* { box-sizing: border-box; margin: 0; padding: 0; }
	img, svg { max-width: 100%; display: block; }

	body {
		background: var(--paper);
		color: var(--ink);
		font-family: var(--sans);
		font-size: 16px;
		line-height: 1.85;
		-webkit-font-smoothing: antialiased;
		overflow-x: hidden;
	}

	.wrap { width: 100%; max-width: 860px; margin: 0 auto; padding: 0 22px; }

	a { color: var(--leaf-deep); text-decoration: none; }
	a:focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; border-radius: 3px; }

	/* ===== 頂部：只有名字與語言切換，不做導覽列 ===== */
	.top { padding: 26px 0 0; }
	.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
	.top-name { font-family: var(--serif); font-size: 15px; letter-spacing: .06em; color: var(--ink-soft); }
	.top-name .dot { color: var(--leaf); }
	.lang { font-size: 13px; letter-spacing: .1em; color: var(--leaf-deep); }

	/* ===== Hero：左邊三行字的自我介紹，右邊是簽名 ===== */
	.hero { padding: 34px 0 46px; }
	.hero-inner { display: grid; gap: 30px; }
	.hero-text h1 {
		font-family: var(--serif);
		font-weight: 400;
		font-size: clamp(38px, 11vw, 64px);
		line-height: 1.18;
		letter-spacing: .02em;
	}
	.roles {
		margin-top: 12px;
		font-size: 15px;
		letter-spacing: .14em;
		color: var(--leaf-deep);
	}
	.lede { margin-top: 22px; max-width: 24em; color: #46543a; }

	/* 簽名：字型字形本身就是手寫感，不再疊裝飾，只給它一點傾斜與紙上的留白 */
	.sig { text-align: center; justify-self: start; }
	.sig-mark {
		font-size: clamp(60px, 17vw, 96px);
		color: var(--leaf-deep);
		transform: rotate(-6deg);
		opacity: .95;
	}
	.sig-label {
		display: block; margin-top: 6px;
		font-size: 11px; letter-spacing: .32em; color: var(--ink-soft);
	}

	/* ===== 作品：只有連結，一條一條排，不寫介紹 ===== */
	section { padding: 34px 0 40px; border-top: 1px solid var(--line); }
	h2 {
		font-family: var(--serif); font-weight: 400;
		font-size: 19px; letter-spacing: .1em; color: var(--ink);
		margin-bottom: 6px;
	}
	.links { display: grid; }
	.link-row {
		display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
		padding: 15px 0; border-bottom: 1px solid var(--line);
		min-height: 48px;
	}
	.link-row:hover { background: var(--cream); }
	.link-name { font-size: 15px; color: var(--ink); }
	.link-url { font-size: 12px; letter-spacing: .03em; color: var(--ink-soft); text-align: right; white-space: nowrap; }

	/* ===== 專長：三行，左標籤右說明 ===== */
	.roles-list { display: grid; gap: 0; margin-top: 6px; }
	.role { display: grid; gap: 2px; padding: 16px 0; border-bottom: 1px solid var(--line); }
	.role-label { font-family: var(--serif); font-size: 17px; color: var(--leaf-deep); }
	.role-note { font-size: 14px; color: var(--ink-soft); }

	/* ===== 頁尾 ===== */
	footer { padding: 34px 0 44px; border-top: 1px solid var(--line); background: var(--paper-deep); }
	.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
	.foot-sign { display: flex; align-items: center; gap: 12px; }
	.foot-mark { font-size: 30px; color: var(--leaf); transform: rotate(-6deg); }
	.foot-text { font-size: 12px; letter-spacing: .06em; color: var(--ink-soft); }
	.foot-text a { color: var(--leaf-deep); }

	/* ===== 768px 以上：左右分欄、專長改成三欄對齊 ===== */
	@media (min-width: 768px) {
		.wrap { padding: 0 40px; }
		.hero { padding: 56px 0 66px; }
		.hero-inner { grid-template-columns: 1fr auto; align-items: center; gap: 46px; }
		.sig { justify-self: end; }
		.sig-mark { font-size: 104px; }
		.link-row { padding: 16px 6px; }
		.role { grid-template-columns: 96px 1fr; align-items: baseline; gap: 18px; }
	}

	@media (prefers-reduced-motion: reduce) {
		.sig-mark, .foot-mark { transform: none; }
	}
</style>
</head>
<body>

<div class="top">
	<div class="wrap top-inner">
		<p class="top-name"><i class="cat cat-111" aria-hidden="true"></i>&nbsp;蛋殼喵 <span class="dot">・</span> DaiEn</p>
		<a class="lang" href="index.html" hreflang="en" lang="en">EN</a>
	</div>
</div>

<main>
	<!-- ===== 自我介紹 ===== -->
	<section class="hero">
		<div class="wrap hero-inner">
			<div class="hero-text">
				<h1>蛋殼喵</h1>
				<p class="roles">作家・程序員</p>
				<p class="lede"><i class="cat cat-005" aria-hidden="true"></i>&nbsp;白天寫程式，晚上寫小說。兩件事其實是同一件：把一段看不見的節奏，變成別人也能感受到的東西。</p>
			</div>
			<div class="sig">
				<i class="cat cat-153 sig-mark" role="img" aria-label="蛋殼喵的手寫簽名"></i>
				<span class="sig-label">DaiEn</span>
			</div>
		</div>
	</section>

	<!-- ===== 作品：只留連結 ===== -->
	<section id="work">
		<div class="wrap">
			<h2>作品</h2>
			<div class="links">
				<a class="link-row" href="#" target="_blank" rel="noopener">
					<span class="link-name">如果死亡只是起點</span>
					<span class="link-url"><i class="cat cat-005" aria-hidden="true"></i>&nbsp;</span>
				</a>
				<a class="link-row" href="https://apng.top/" target="_blank" rel="noopener">
					<span class="link-name">蛋壳喵 APNG 工具</span>
					<span class="link-url"><i class="cat cat-257" aria-hidden="true"></i>&nbsp;apng.top</span>
				</a>
				<a class="link-row" href="https://github.com/egawadaien-design/eggshell-cat-apng-tool" target="_blank" rel="noopener">
					<span class="link-name">GitHub 託管代碼</span>
					<span class="link-url"><i class="cat cat-097" aria-hidden="true"></i>&nbsp;github.com</span>
				</a>
			</div>
		</div>
	</section>

	<!-- ===== 專長 ===== -->
	<section id="roles">
		<div class="wrap">
			<h2>我在做的事</h2>
			<div class="roles-list">
				<div class="role">
					<span class="role-label"><i class="cat cat-078" aria-hidden="true"></i>&nbsp;作家</span>
					<span class="role-note">長篇小說，人物與世界觀設定；喜歡把複雜的東西寫到能被讀懂。</span>
				</div>
				<div class="role">
					<span class="role-label"><i class="cat cat-079" aria-hidden="true"></i>&nbsp;程序員</span>
					<span class="role-note">原生 JavaScript 與 Canvas，不用框架、不加建置，一個靜態資料夾就能跑。</span>
				</div>
			</div>
		</div>
	</section>
</main>

<footer>
	<div class="wrap foot">
		<div class="foot-sign">
			<i class="cat cat-112 cat-2x" aria-hidden="true"></i>
			<i class="cat cat-153 foot-mark" aria-hidden="true"></i>
			<p class="foot-text">&copy; 2026 DaiEn ・ EggshellCat</p>
		</div>
		<p class="foot-text">
			<a href="https://github.com/" target="_blank" rel="noopener">
				<i class="cat cat-097" aria-hidden="true"></i>&nbsp;GitHub
			</a>
			&nbsp;&nbsp;&nbsp;&nbsp;
			<a href="index.html" hreflang="en" lang="en">
				<i class="cat cat-015" aria-hidden="true"></i>&nbsp;English
			</a>
		</p>
	</div>
</footer>

</body>
