<!--
	@author: [DaiEn]
	@Date: 2026-11-14
	@Correction: 15
	本次修正：三頁合成一頁——index-zh / index-en 的內容併進這裡，語言交給同資料夾的 i18n.js
	          （預設中文，右上角字形鈕與頁尾連結切換英文，選擇記在 localStorage）。
	          原本首頁那兩個語言入口整段移除，進站直接看到中文的自我介紹。
	上次修正：兩個語言圖示改成「水平＋垂直都置中」——main 從單純吃剩餘高度（flex:1）再變成
	          flex 容器（align-items／justify-content 都 center），hero 補 width:100% 免得縮成內容寬，
	          上下留白改成對稱（50/50、768 以上 70/70），不然原本 46 對 58 的差值會讓整組偏低
	上次修正：共用樣式抽成同資料夾的 index.css（圖標字型、色票、reset、body、.wrap、連結、頂部名字、頁尾、網路圖層），
	          這頁的 <style> 只剩自己的版式；三頁外觀完全不變
	上次修正：把 inline script 抽成同資料夾的 index.js（這頁只留 <script src="index.js"></script>），
	          讓 index / index-zh / index-en 三個語言頁共用同一支背景網路；程式與外觀完全不變
	上次修正：新增 OPACITY 選項（0~255，方向跟 CSS 的 alpha 相反：0＝最清楚、255＝整片消失），
	          同一個倍率套在點、線段、三角形面紗上，整片網路一起濃淡——
	          只淡點或只淡線會出現「線還在、點不見」的鬼畫面，所以三者共用一個倍率
	上次修正：顏色玩法多了「一次顯示幾色」的隱藏選項（在 JS 最上面的 COLOR_MODE 數字，畫面上不放選單）：
	          0＝多色同時（原本的 9 色各據一方）、1＝四色一組、2＝三色一組、3＝雙色一組、4＝單色；
	          1～4 每組先停一段時間，再用幾秒沿最短色相路徑慢慢過渡到「另一組隨機挑的顏色」，無限循環
	上次修正：粒子網路的點與線改成七色以上鮮艷漸變——每顆粒子的顏色從 9 色彩虹盤裡「隨機」抽
	          （沿用原本的固定種子，所以每次重整都是同一片花花網路，但顏色順序是亂的、不是照位置排），
	          線段兩端各取自己那顆粒子的顏色拉線性漸層，跨色區時自然過渡；
	          三角形面紗改成跟頂點借色相、濃度壓很低，避免彩色疊太多變成一塊髒斑
	上次修正：背景改成自己寫的「粒子網路」（節點＋近距離連線＋三點互連的淡色三角形），
	          配色照這頁的蘋果綠紙底走，不鋪黑底、也不引入 tsParticles
	上次修正：頁尾強制置底——body 改成垂直 flex（min-height: 100vh／100dvh），main 用 flex:1 吃掉中間空白、
	          footer 用 flex:0 0 auto 固定高度，內容不滿一屏時頁尾也貼在視窗最下面；不用 position:fixed，
	          免得蓋到內容、內容變長時也不必另外留 padding
-->
<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>蛋殼喵 DaiEn — 作家・程序員・企業負責人</title>
		<meta name="description" content="蛋殼喵 DaiEn" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a7cf52'/%3E%3Cpath d='M32 15c8 0 14 7 14 16 0 10-6 18-14 18S18 41 18 31c0-9 6-16 14-16z' fill='%23f7fbef'/%3E%3Ccircle cx='26' cy='32' r='2.6' fill='%232f3e25'/%3E%3Ccircle cx='38' cy='32' r='2.6' fill='%232f3e25'/%3E%3Cpath d='M32 37l-3 4h6z' fill='%237fac30'/%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="index.css" />
		<style>
			/* ===== 這一頁自己的版式；圖標字型、色票、reset、頁尾、網路圖層都在 index.css ===== */

			/* 中文是預設語言，所以中文字型擺在 :root；
			   切成英文時由 index.css 的 html:lang(en) 那組覆寫成 Iowan／Segoe UI */
			:root {
				--serif: "Songti TC", "Noto Serif TC", "PMingLiU", Georgia, serif;
				--sans: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, "Segoe UI", sans-serif;
			}

			/* ===== Hero：左邊自我介紹，右邊簽名 =====
			   手機是單欄，但要寫成 minmax(0, 1fr)：只寫 display:grid 的話，自動欄寬會跟著裡面的寬圖示長到
			   max-content，整欄比視窗還寬，右邊那句引言就被切掉（390 寬才看得出來）。 */
			.hero { padding: 34px 0 46px; }
			.hero-inner { display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; }

			/* ===== 頁尾置底：內容不滿一屏時 footer 貼在視窗最下面，內容長了它自然被推下去
			   用 body 垂直 flex 而不是 position:fixed，才不會蓋到內容、也不必另外留 padding ===== */
			body {
				display: flex;
				flex-direction: column;
				min-height: 100vh;
				min-height: 100dvh;
			}
			main { flex: 1 1 auto; }
			footer { flex: 0 0 auto; }

			/* ===== 區塊分隔線：作品與專長各一條，hero 不畫 ===== */
			section + section { border-top: 1px solid var(--line); }
			section { padding: 34px 0 40px; }

			/* ===== 頁尾：簽名在左、連結在右 ===== */
			.foot { justify-content: space-between; }

			/* ===== 語言鈕：顯示「切過去的那個語言」，所以中文模式看得到 En、英文模式看得到簡 ===== */
			.lang {
				background: none;
				border: 0;
				padding: 4px 2px;
				cursor: pointer;
				line-height: 1;
				font-size: 13px;
			}
			.lang .cat { font-size: 22px; color: var(--leaf-deep); }
			html:lang(zh-Hant) .lang-zh { display: none; }
			html:lang(en) .lang-en { display: none; }

			.foot-lang {
				background: none;
				border: 0;
				padding: 0;
				cursor: pointer;
				font: inherit;
				color: var(--leaf-deep);
			}

			/* ===== 768px 以上：左右等寬兩欄，誰也不吃掉誰 ===== */
			@media (min-width: 768px) {
				.hero { padding: 56px 0 66px; }
				.hero-inner {
					grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
					align-items: center;
					gap: 44px;
				}
			}

			/* ===== 1120px 以上：文字那一側多分一點，字不會被擠成細柱 ===== */
			@media (min-width: 1120px) {
				.hero-inner {
					grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
					gap: 56px;
				}
			}
		</style>
	</head>
	<body>
		<canvas id="netCanvas" aria-hidden="true"></canvas>

		<div class="top">
			<div class="wrap top-inner">
				<p class="top-name">
					<i class="cat cat-111" aria-hidden="true"></i>&nbsp;<span data-i18n="brand">蛋殼喵</span>
					<span class="dot">・</span> <span data-i18n="brandSub">DaiEn</span>
				</p>
				<button class="lang" id="langBtn" type="button" aria-label="切換語言 / Switch language">
					<i class="cat cat-015 lang-en" aria-hidden="true"></i>
					<i class="cat cat-013 lang-zh" aria-hidden="true"></i>
				</button>
			</div>
		</div>

		<main>
			<!-- ===== 自我介紹 ===== -->
			<section class="hero">
				<div class="wrap hero-inner">
					<div class="hero-text">
						<h1><i class="cat cat-153 sig-mark" role="img" aria-label="DaiEn"></i></h1>
						<p class="roles">
							<span data-i18n="roles1">作家・程序員</span><br /><span data-i18n="roles2"
								>寫下來的，才開始存在</span
							>
						</p>
						<p class="lede">
							<i class="cat cat-005" aria-hidden="true"></i>&nbsp;<span data-i18n="lede"
								>白天寫程式，晚上寫小說。兩件事其實是同一件：把一段看不見的節奏，變成別人也能感受到的東西。</span
							>
						</p>
					</div>
					<div class="sig">
						<h1><i class="cat cat-112 cat-5x" role="img" aria-label="DaiEn"></i></h1>
						<span class="sig-label" data-i18n="sigLabel"
							>一切过往，一切未来&nbsp;&nbsp;&nbsp;&nbsp;存在之轮，永恒流转</span
						>
					</div>
				</div>
			</section>

			<!-- ===== 作品：只留連結 ===== -->
			<section id="work">
				<div class="wrap">
					<h2><span data-i18n="workTitle">作品</span></h2>
					<div class="links">
						<a class="link-row" href="#" target="_blank" rel="noopener">
							<span class="link-name" data-i18n="work1">如果死亡只是起點</span>
							<span class="link-url"><i class="cat cat-005" aria-hidden="true"></i>&nbsp;</span>
						</a>
						<a class="link-row" href="https://apng.top/" target="_blank" rel="noopener">
							<span class="link-name" data-i18n="work2">蛋壳喵 APNG 工具</span>
							<span class="link-url"><i class="cat cat-257" aria-hidden="true"></i>&nbsp;apng.top</span>
						</a>
						<a
							class="link-row"
							href="https://github.com/egawadaien-design/eggshell-cat-apng-tool"
							target="_blank"
							rel="noopener"
						>
							<span class="link-name" data-i18n="work3">GitHub 託管代碼</span>
							<span class="link-url"><i class="cat cat-097" aria-hidden="true"></i>&nbsp;github.com</span>
						</a>
					</div>
				</div>
			</section>

			<!-- ===== 專長 ===== -->
			<section id="roles">
				<div class="wrap">
					<h2><span data-i18n="rolesTitle">我在做的事</span></h2>
					<div class="roles-list">
						<div class="role">
							<span class="role-label"
								><i class="cat cat-078" aria-hidden="true"></i>&nbsp;<span data-i18n="role1Label"
									>作家</span
								></span
							>
							<span class="role-note" data-i18n="role1Note"
								>長篇小說，人物與世界觀設定；喜歡把複雜的東西寫到能被讀懂。</span
							>
						</div>
						<div class="role">
							<span class="role-label"
								><i class="cat cat-079" aria-hidden="true"></i>&nbsp;<span data-i18n="role2Label"
									>程序員</span
								></span
							>
							<span class="role-note" data-i18n="role2Note"
								>原生 JavaScript 與 Canvas，不用框架、不加建置，一個靜態資料夾就能跑。</span
							>
						</div>
					</div>
				</div>
			</section>
		</main>

		<footer>
			<div class="wrap foot">
				<div class="foot-sign">
					<i class="cat cat-112 cat-2x" aria-hidden="true"></i>
					<i class="cat cat-153 foot-mark" aria-hidden="true"></i>
					<p class="foot-text">&copy; 2026 DaiEn ・ EggshellCat</p>
				</div>
				<p class="foot-text">
					<a href="https://github.com/" target="_blank" rel="noopener">
						<i class="cat cat-097" aria-hidden="true"></i>&nbsp;GitHub
					</a>
					&nbsp;&nbsp;&nbsp;&nbsp;
					<button class="foot-lang" id="footLangBtn" type="button">
						<i class="cat cat-015 lang-en" aria-hidden="true"></i>&nbsp;<span class="lang-en">English</span>
						<i class="cat cat-013 lang-zh" aria-hidden="true"></i>&nbsp;<span class="lang-zh">中文</span>
					</button>
				</p>
			</div>
		</footer>

		<script src="i18n.js"></script>
		<script src="index.js"></script>
	</body>
</html>
