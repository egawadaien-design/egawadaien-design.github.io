<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>蛋殼喵 DaiEn — 作家・程序員・企業負責人</title>
		<meta name="description" content="蛋殼喵 DaiEn" />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a7cf52'/%3E%3Cpath d='M32 15c8 0 14 7 14 16 0 10-6 18-14 18S18 41 18 31c0-9 6-16 14-16z' fill='%23f7fbef'/%3E%3Ccircle cx='26' cy='32' r='2.6' fill='%232f3e25'/%3E%3Ccircle cx='38' cy='32' r='2.6' fill='%232f3e25'/%3E%3Cpath d='M32 37l-3 4h6z' fill='%237fac30'/%3E%3C/svg%3E"
		/>
		<link rel="stylesheet" href="index.css" />
		<style>
			/* ===== 這一頁自己的版式；圖標字型、色票、reset、頁尾、網路圖層都在 index.css ===== */

			/* 中文是預設語言，所以中文字型擺在 :root；
			   切成英文時由 index.css 的 html:lang(en) 那組覆寫成 Iowan／Segoe UI */
			:root {
				--serif: "Songti TC", "Noto Serif TC", "PMingLiU", Georgia, serif;
				--sans: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, "Segoe UI", sans-serif;
			}

			/* ===== Hero：左邊自我介紹，右邊簽名 =====
			   手機是單欄，但要寫成 minmax(0, 1fr)：只寫 display:grid 的話，自動欄寬會跟著裡面的寬圖示長到
			   max-content，整欄比視窗還寬，右邊那句引言就被切掉（390 寬才看得出來）。 */
			.hero { padding: 34px 0 46px; }
			.hero-inner { display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; }

			/* ===== 頁尾置底：內容不滿一屏時 footer 貼在視窗最下面，內容長了它自然被推下去
			   用 body 垂直 flex 而不是 position:fixed，才不會蓋到內容、也不必另外留 padding ===== */
			body {
				display: flex;
				flex-direction: column;
				min-height: 100vh;
				min-height: 100dvh;
			}
			main { flex: 1 1 auto; }
			footer { flex: 0 0 auto; }

			/* ===== 區塊分隔線：作品與專長各一條，hero 不畫 ===== */
			section + section { border-top: 1px solid var(--line); }
			section { padding: 34px 0 40px; }

			/* ===== 頁尾：簽名在左、連結在右 ===== */
			.foot { justify-content: space-between; }

			/* ===== 語言鈕：顯示「切過去的那個語言」，所以中文模式看得到 En、英文模式看得到簡 ===== */
			.lang {
				background: none;
				border: 0;
				padding: 4px 2px;
				cursor: pointer;
				line-height: 1;
				font-size: 13px;
			}
			.lang .cat { font-size: 22px; color: var(--leaf-deep); }
			html:lang(zh-Hant) .lang-zh { display: none; }
			html:lang(en) .lang-en { display: none; }

			.foot-lang {
				background: none;
				border: 0;
				padding: 0;
				cursor: pointer;
				font: inherit;
				color: var(--leaf-deep);
			}

			/* ===== 768px 以上：左右等寬兩欄，誰也不吃掉誰 ===== */
			@media (min-width: 768px) {
				.hero { padding: 56px 0 66px; }
				.hero-inner {
					grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
					align-items: center;
					gap: 44px;
				}
			}

			/* ===== 1120px 以上：文字那一側多分一點，字不會被擠成細柱 ===== */
			@media (min-width: 1120px) {
				.hero-inner {
					grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
					gap: 56px;
				}
			}
		</style>
	</head>
	<body>

		<div class="top">

				</p>
				<button class="lang" id="langBtn" type="button" aria-label="切換語言 / Switch language">
					<i class="cat cat-015 lang-en" aria-hidden="true"></i>

		</div>

		<main>

								>白天寫程式，晚上寫小說。兩件事其實是同一件：把一段看不見的節奏，變成別人也能感受到的東西。</span
							>
						</p>
					</div>
					<div class="sig">

						<span class="sig-label" data-i18n="sigLabel"

						>

			</section>

			<!-- ===== 作品：只留連結 ===== -->
			<section id="work">
				<div class="wrap">

					<div class="links">
						<a class="link-row" href="#" target="_blank" rel="noopener">
							<span class="link-name" data-i18n="work1">如果死亡只是起點</span>
							<span class="link-url"><i class="cat cat-005" aria-hidden="true"></i>&nbsp;</span>

							<span class="link-url"><i class="cat cat-257" aria-hidden="true"></i>&nbsp;apng.top</span>
						</a>
						<a

			<!-- ===== 專長 ===== -->
			<section id="roles">

					<h2><span data-i18n="rolesTitle">我在做的事</span></h2>
					<div class="roles-list">

								><i class="cat cat-078" aria-hidden="true"></i>&nbsp;<span data-i18n="role1Label"
									>作家</span

							<span class="role-note" data-i18n="role1Note"
								>長篇小說，人物與世界觀設定；喜歡把複雜的東西寫到能被讀懂。</span
							>
						</div>

		<script src="i18n.js"></script>
		<script src="index.js"></script>
