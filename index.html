	@author: [DaiEn]
	@Date: 2026-11-13
	@Correction: 5
	本次修正：抬頭與頁尾也一併置中（.top 加 text-align、.foot 由 space-between 改成 center），三塊都與 hero 同一個中軸
	上次修正：只留這頁真正用到的樣式（砍掉自我介紹、作品列、專長列等沒掛上的規則與多餘字級），
	          兩個語言圖示改成 flex 置中並用 clamp 控制大小，手機與桌機都居中對齊
	上次修正：修正次數 2 → 3
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaiEn — Writer・Programmer</title>
<meta name="description" content="DaiEn">
<link rel="alternate" hreflang="zh-Hant" href="index-zh.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a7cf52'/%3E%3Cpath d='M32 15c8 0 14 7 14 16 0 10-6 18-14 18S18 41 18 31c0-9 6-16 14-16z' fill='%23f7fbef'/%3E%3Ccircle cx='26' cy='32' r='2.6' fill='%232f3e25'/%3E%3Ccircle cx='38' cy='32' r='2.6' fill='%232f3e25'/%3E%3Cpath d='M32 37l-3 4h6z' fill='%237fac30'/%3E%3C/svg%3E">
<style>
	/* ===== Self-made icon font: the signature is cat-153, code \F0098 (same as webfonts/font.css) ===== */
	@font-face {
		font-family: 'CatEmoji';
		font-style: normal;
		font-display: swap;
		src: url('https://egawadaien-design.github.io/eggshell-cat-apng-tool/webfonts/EggshellCat.woff') format('woff'),
			url('https://egawadaien-design.github.io/eggshell-cat-apng-tool/webfonts/EggshellCat.ttf') format('truetype');
	}
	.cat {
		font-family: 'CatEmoji';
		font-style: normal;
		font-weight: 300;
		line-height: 1;
		display: inline-block;
		-webkit-font-smoothing: antialiased;
	}
	/* 只留這頁用到的五個字：013 / 015（兩個語言入口）、111（抬頭）、112 / 153（頁尾） */
	.cat-013:before { content: "\F000C"; }
	.cat-015:before { content: "\F000E"; }
	.cat-111:before { content: "\F006E"; }
	.cat-112:before { content: "\F006F"; }
	.cat-153:before { content: "\F0098"; }
	.cat-213:before { content: "\F00D4"; }
	.cat-214:before { content: "\F00D5"; }
	.cat-215:before { content: "\F00D6"; }
	.cat-2x { font-size: 2em; }

	/* ===== Palette: apple green ground, olive ink ===== */
	:root {
		--paper: #eef7dd;        /* apple green ground */
		--paper-deep: #e3f1c9;   /* the shallow band between blocks */
		--ink: #2f3e25;          /* main text: deep olive */
		--ink-soft: #5f6f4d;     /* secondary text */
		--leaf: #7fac30;         /* the apple green itself */
		--leaf-deep: #587d22;    /* links and signature */
		--line: #cfe3ae;
		--serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
		--sans: "Segoe UI", -apple-system, "Helvetica Neue", sans-serif;
	}

	* { box-sizing: border-box; margin: 0; padding: 0; }

	body {
		background: var(--paper);
		color: var(--ink);
		font-family: var(--sans);
		font-size: 16px;
		line-height: 1.85;
		-webkit-font-smoothing: antialiased;
		overflow-x: hidden;
	}

	.wrap { width: 100%; max-width: 860px; margin: 0 auto; padding: 0 22px; }

	a { color: var(--leaf-deep); text-decoration: none; }
	a:focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; border-radius: 3px; }

	/* ===== Top: name only, centred like the hero ===== */
	.top { padding: 26px 0 0; text-align: center; }
	.top-name { font-family: var(--serif); font-size: 15px; letter-spacing: .06em; color: var(--ink-soft); }
	.top-name .dot { color: var(--leaf); }

	/* ===== Hero: the two language glyphs, centred ===== */
	.hero { padding: 46px 0 58px; }
	.hero-inner {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: center;
		gap: clamp(32px, 10vw, 120px);
	}
	/* 圖示放大後要壓住 a 的行高，不然外框會多出一截空白 */
	.hero a { display: block; line-height: 0; }
	.hero .cat {
		font-size: clamp(72px, 14vw, 132px);
		color: var(--leaf-deep);
		line-height: 1;
	}

	/* ===== Footer ===== */
	footer { padding: 34px 0 44px; border-top: 1px solid var(--line); background: var(--paper-deep); text-align: center; }
	.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; }
	.foot-sign { display: flex; align-items: center; gap: 12px; }
	.foot-mark { font-size: 30px; color: var(--leaf); transform: rotate(-6deg); }
	.foot-text { font-size: 12px; letter-spacing: .06em; color: var(--ink-soft); }

	@media (min-width: 768px) {
		.wrap { padding: 0 40px; }
		.hero { padding: 64px 0 76px; }
	}

	@media (prefers-reduced-motion: reduce) {
		.foot-mark { transform: none; }
	}
</style>
</head>
<body>

<div class="top">
	<div class="wrap">
		<p class="top-name"><i class="cat cat-111" aria-hidden="true"></i>&nbsp;DaiEn <span class="dot">·</span> Eggshell Cat</p>
	</div>
</div>

<main>
	<!-- ===== 兩個語言入口：圖示置中 ===== -->
	<section class="hero">
		<div class="wrap hero-inner">
			<a href="index-en.html">
				<i class="cat cat-215" aria-hidden="true"></i>
			</a>
			<a href="index-zh.html">
				<i class="cat cat-213" aria-hidden="true"></i>
			</a>
		</div>
	</section>

<footer>
	<div class="wrap foot">
		<div class="foot-sign">
			<i class="cat cat-112 cat-2x" aria-hidden="true"></i>
			<i class="cat cat-153 foot-mark" aria-hidden="true"></i>
			<p class="foot-text">&copy; 2026 DaiEn · EggshellCat</p>
		</div>
	</div>
</footer>

</body>
</html>
